# Local development stack for this fork.
#
#   makesure up        — bambuddy + frontend
#   makesure ts        — the same, published on the tailnet as bambuddy-dev
#   makesure down
#
# Everything here is driven by the Makesurefile; the raw compose commands are
# `docker compose up -d` and `docker compose --profile ts up -d`.
#
# bambuddy runs the fork's published image for the runtime (Python deps, ffmpeg)
# with the working tree's backend/ mounted over the image's copy and uvicorn
# --reload on top: edit a file, the backend restarts. frontend is a plain node
# container running vite; both source trees are bind-mounted, so nothing is
# rebuilt to see a change.
#
# Networking is bridge mode — Docker Desktop and Colima on macOS have no host
# networking. Outbound to the printers on the LAN works (they are added by
# static IP), so live status, camera and control are fine. SSDP discovery and
# the virtual printers do not: those need to bind LAN addresses of their own.
#
# Data lives in ./dev-data (gitignored). Seed it from the production instance
# with scripts/dev-restore.sh.

services:
  bambuddy:
    image: ghcr.io/grengojbo/bambuddy:${BAMBUDDY_TAG:-latest}
    container_name: bambuddy
    # Dev stack: never resurrect itself after a crash or a host reboot.
    restart: "no"
    # Needed to bind the privileged ports the virtual printers use (322 RTSPS,
    # 990 FTPS) as a non-root user. Costs nothing when no VP is running, and
    # without it those listeners fail silently rather than loudly.
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${DEV_PORT:-8000}:8000"
      # Virtual-printer ports. Uncomment when a change actually touches the VP
      # path — on macOS they still only get you as far as the Colima VM, since
      # SSDP discovery and the virtual printers' own LAN binds need a real host
      # network. On a Linux host, use `network_mode: host` instead of this whole
      # ports block, the way upstream's compose does.
      #- "3000:3000"                  # VP bind/detect
      #- "3002:3002"                  # VP bind/detect
      #- "8883:8883"                  # VP MQTT
      #- "990:990"                    # VP FTP control
      #- "6000:6000"                  # VP file transfer tunnel
      #- "322:322"                    # VP RTSP camera
      #- "2024-2026:2024-2026"        # VP proprietary ports (A1/P1S)
      #- "50000-50029:50000-50029"    # VP FTP passive data (3 VPs × 10-port slice)
    volumes:
      # The working tree's backend over the image's copy. Read-only: the app
      # writes to /app/data, never to its own source, and this keeps a stray
      # container-side write from landing in the git tree.
      - ./backend:/app/backend:ro
      - ./dev-data/data:/app/data
      - ./dev-data/logs:/app/logs
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      # Match the host user so files under ./dev-data are yours: `id -u` / `id -g`.
      PUID: ${PUID:-501}
      PGID: ${PGID:-20}
      PORT: "8000"
      # Bridge mode only: the address slicers use to reach Bambuddy, and the
      # one FTP passive mode advertises. Without them a VP hands the slicer the
      # container IP (172.x) and the upload has nowhere to go. Set to the host's
      # LAN address if the VP ports above get uncommented.
      #VIRTUAL_PRINTER_ADVERTISE_ADDRESS: <host LAN address>
      #VIRTUAL_PRINTER_PASV_ADDRESS: <host LAN address>
      # Sidecars are reachable by service name inside the compose network, on
      # their internal port 3000 — not on the host-side 3003/3001. Harmless
      # when the profiles are off: Bambuddy only dials these once "Use Slicer
      # API" is enabled in Settings.
      # SLICER_API_URL: http://orca-slicer-api:3000
      # BAMBU_STUDIO_API_URL: http://bambu-studio-api:3000
    # --reload needs an explicit reload-dir: the default watches the whole CWD,
    # which here includes /app/data (thumbnails, timelapses, uploads) and would
    # restart the backend every time a printer writes a file.
    command:
      - sh
      - -c
      - exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --loop asyncio --reload --reload-dir /app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Docker SIGKILLs after 10s by default. Shutdown checkpoints the SQLite WAL,
    # disconnects MQTT and stops the virtual printers; being killed halfway
    # through that is how a database ends up with a stale WAL. The headroom is
    # free — the container exits when it is done, not when the timer runs out.
    stop_grace_period: 30s

  frontend:
    image: node:22-bookworm-slim
    container_name: bambuddy-dev-frontend
    restart: "no"
    working_dir: /app
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # node_modules in a named volume, not on the bind mount: it is ~1 GB of
      # small files, and pushing those through the VM's filesystem translation
      # makes vite's cold start several times slower.
      - frontend_node_modules:/app/node_modules
    environment:
      # vite.config.dev.ts reads these. The upstream config proxies /api to
      # localhost, which inside a container means the container itself.
      BACKEND_URL: http://bambuddy:8000
      # Set when serving through Tailscale, so vite accepts that Host header
      # and points HMR at the wss:// endpoint instead of the local one.
      TS_HOSTNAME: ${TS_HOSTNAME:-}
    # npm ci only when the volume is empty — every later start goes straight to
    # vite. `exec` keeps vite as PID 1 so `docker stop` actually reaches it.
    command:
      - sh
      - -c
      - '[ -d node_modules/vite ] || npm ci; exec npm run dev -- --config vite.config.dev.ts --host 0.0.0.0'
    depends_on:
      - bambuddy

  # Publishes the dev stack on the tailnet as https://bambuddy-dev.<tailnet>.ts.net
  # with a real certificate, so the UI opens from the phone or another machine
  # without port forwarding. Off by default — it needs an auth key.
  #
  # Userspace networking (the image's default) is enough: this container only
  # accepts tailnet connections and dials the frontend over the compose
  # network. No TUN device, no NET_ADMIN, nothing privileged.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: bambuddy-dev-ts
    hostname: bambuddy-dev
    restart: "no"
    environment:
      # Reusable auth key from the admin console, kept in .env (gitignored).
      # Not declared required here: compose interpolates before it filters by
      # profile, so `${TS_AUTHKEY:?...}` would break plain `up` too. The
      # Makesurefile checks for it before starting this profile.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --hostname=bambuddy-dev
    volumes:
      - ./dev-data/tailscale:/var/lib/tailscale
      - ./dev/tailscale-serve.json:/config/serve.json:ro
    depends_on:
      - frontend
    profiles:
      - ts

volumes:
  frontend_node_modules:
