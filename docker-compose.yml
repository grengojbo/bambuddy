services:
  bambuddy:
    image: ghcr.io/grengojbo/bambuddy:${BAMBUDDY_TAG:-latest}
    container_name: bambuddy
    # Dev stack: never resurrect itself after a crash or a host reboot.
    restart: "no"
    # Needed to bind the privileged ports the virtual printers use (322 RTSPS,
    # 990 FTPS) as a non-root user. Costs nothing when no VP is running, and
    # without it those listeners fail silently rather than loudly.
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${DEV_PORT:-8000}:8000"
      # Virtual-printer ports. Uncomment when a change actually touches the VP
      # path — on macOS they still only get you as far as the Colima VM, since
      # SSDP discovery and the LAN binds (<LAN address>) need a real host
      # network. On a Linux host, use `network_mode: host` instead of this whole
      # ports block, the way upstream's compose does.
      #- "3000:3000"                  # VP bind/detect
      #- "3002:3002"                  # VP bind/detect
      #- "8883:8883"                  # VP MQTT
      #- "990:990"                    # VP FTP control
      #- "6000:6000"                  # VP file transfer tunnel
      #- "322:322"                    # VP RTSP camera
      #- "2024-2026:2024-2026"        # VP proprietary ports (A1/P1S)
      #- "50000-50029:50000-50029"    # VP FTP passive data (3 VPs × 10-port slice)
    volumes:
      # The working tree's backend over the image's copy. Read-only: the app
      # writes to /app/data, never to its own source, and this keeps a stray
      # container-side write from landing in the git tree.
      - ./backend:/app/backend:ro
      - ./dev-data/data:/app/data
      - ./dev-data/logs:/app/logs
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      # Match the host user so files under ./dev-data are yours: `id -u` / `id -g`.
      PUID: ${PUID:-501}
      PGID: ${PGID:-20}
      PORT: "8000"
      # Bridge mode only: the address slicers use to reach Bambuddy, and the
      # one FTP passive mode advertises. Without them a VP hands the slicer the
      # container IP (172.x) and the upload has nowhere to go. Set to the host's
      # LAN address if the VP ports above get uncommented.
      #VIRTUAL_PRINTER_ADVERTISE_ADDRESS: <LAN address>
      #VIRTUAL_PRINTER_PASV_ADDRESS: <LAN address>
      # Sidecars are reachable by service name inside the compose network, on
      # their internal port 3000 — not on the host-side 3003/3001. Harmless
      # when the profiles are off: Bambuddy only dials these once "Use Slicer
      # API" is enabled in Settings.
      # SLICER_API_URL: http://orca-slicer-api:3000
      # BAMBU_STUDIO_API_URL: http://bambu-studio-api:3000
    # --reload needs an explicit reload-dir: the default watches the whole CWD,
    # which here includes /app/data (thumbnails, timelapses, uploads) and would
    # restart the backend every time a printer writes a file.
    command:
      - sh
      - -c
      - exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --loop asyncio --reload --reload-dir /app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Docker SIGKILLs after 10s by default. Shutdown checkpoints the SQLite WAL,
    # disconnects MQTT and stops the virtual printers; being killed halfway
    # through that is how a database ends up with a stale WAL. The headroom is
    # free — the container exits when it is done, not when the timer runs out.
    stop_grace_period: 30s